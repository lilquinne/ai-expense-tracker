name: expense_tracker
description: AI-powered expense tracker with OCR receipt scanning
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  riverpod: ^2.4.9

  # Local Database
  sqflite: ^2.3.0
  supabase_flutter: ^2.10.3
  path: ^1.8.3

  # Camera & Image
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  image: ^4.1.7

  # OCR
  google_mlkit_text_recognition: ^0.13.0

  # Charts
  fl_chart: ^0.68.0

  # Date & Formatting
  intl: ^0.19.0

  # UI Components
  flutter_slidable: ^3.1.0
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # Icons
  cupertino_icons: ^1.0.6
  flutter_vector_icons: ^2.0.0

  # Utils
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  http: ^1.2.0
  permission_handler: ^11.3.0
  path_provider: ^2.1.2
  file_picker: ^8.3.7
  share_plus: ^10.1.4
  pdf: ^3.11.3
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4
  currency_formatter: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
        - asset: assets/fonts/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
